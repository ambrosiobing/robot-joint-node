# The joint protocol: one description, four generated outputs.
#
# Chapter 11 of the volume. Edit this file, run the generator, commit both:
#
#     python tools/gen_msgs.py proto/messages.yaml \
#            --c src/bus --py host --dbc proto/joint.dbc --vectors test/vectors.json
#
# Nothing it writes may be edited by hand. Each generated file carries a hash of
# this description in its banner, and the generator refuses to overwrite a file
# whose body no longer matches its own banner, so a hand edit is caught rather
# than silently lost.

protocol:
  name: joint
  version: 1
  byte_order: little          # fixed offsets, fixed order, never a structure copy
  id_bits: 11                 # the short identifier, chapter 11 step 3
  node_id_bits: 7             # 127 nodes, the field bus profile's arrangement

# The ordering here IS the arbitration order: lower identifier wins, and the
# identifier is function_code << 7 | node_id, so priority falls out of this list.
function_codes:
  - {name: EMERGENCY,  code: 0x1, note: "a node has entered a safe state"}
  - {name: COMMAND,    code: 0x2, note: "master to node, every period"}
  - {name: STATE,      code: 0x3, note: "node to master, every period"}
  - {name: DIAGNOSTIC, code: 0x4, note: "low rate, anything not needed every period"}

# Lengths are chosen to land on a value the frame format allows, which is a
# design constraint rather than a coincidence. 24 and 16 are both allowed.
messages:

  state:
    function_code: STATE
    length: 24
    direction: node_to_master
    note: "every period, from the node"
    fields:
      - {name: position_counts, type: i32, offset: 0,  unit: counts,
         note: "exact, and the encoder's own unit"}
      - {name: velocity_mrad_s, type: i32, offset: 4,  unit: mrad/s,
         note: "milli-radians per second"}
      - {name: effort_mnm,      type: i32, offset: 8,  unit: mNm,
         note: "milli-newton-metres, and DERIVED unless effort_source says otherwise"}
      - {name: stamp_us,        type: u32, offset: 12, unit: us,
         note: "the low 32 bits of the node's own clock, wraps about every 71 minutes"}
      - {name: valid_flags,     type: u16, offset: 16, unit: bitfield,
         note: "one bit per value field above"}
      - {name: fault_flags,     type: u16, offset: 18, unit: bitfield,
         note: "chapter 18 assigns the meanings"}
      - {name: mode,            type: u8,  offset: 20, unit: enum,
         note: "chapter 12's node state"}
      - {name: effort_source,   type: u8,  offset: 21, unit: enum,
         note: "0 DERIVED, 1 MEASURED, chapter 8"}
      - {name: model_version,   type: u8,  offset: 22, unit: enum,
         note: "which parameter set produced the effort figure"}
      - {name: seq,             type: u8,  offset: 23, unit: count,
         note: "wraps, and the master notices gaps"}

  command:
    function_code: COMMAND
    length: 16
    direction: master_to_node
    note: "every period, to the node"
    fields:
      - {name: target,          type: i32, offset: 0,  unit: counts,
         note: "the setpoint, in the same unit the encoder reports"}
      - {name: valid_until_us,  type: u32, offset: 4,  unit: us,
         note: "low 32 bits, the same wrap as stamp_us. A command is valid until a time, not forever"}
      - {name: mode_req,        type: u8,  offset: 8,  unit: enum,
         note: "the mode the master is asking for"}
      - {name: expiry_policy,   type: u8,  offset: 9,  unit: enum,
         note: "what the node does when this command expires. 0 is a controlled stop"}
      - {name: seq,             type: u8,  offset: 10, unit: count,
         note: "wraps. A repeat of the last sequence number is stale, not new"}
      - {name: reserved_11,     type: u8,  offset: 11, unit: reserved,
         note: "must be zero. Reserved rather than removed, so the length stays allowed"}
      - {name: reserved_12,     type: u32, offset: 12, unit: reserved,
         note: "must be zero. Chapter 16 may claim these four bytes for a feed-forward term"}
