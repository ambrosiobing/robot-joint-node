name: checks

# Two jobs, because they answer different questions and a failure in one should
# not hide the state of the other.
#
# checks   the book: house rules, cross-chapter consistency, and whether the
#          Markdown edition still matches its source. Needs only Python.
#
# software the chapters under joint-node/, each on its own terms. This is where
#          the C is compiled and the socket is exercised, neither of which can
#          happen on the authoring laptop: it has no compiler, and its Python
#          has no AF_CAN. The runner has both, so the things that can only be
#          skipped locally are actually run here.
#
# Building the book itself needs a TeX installation and is done locally, so
# the Markdown check regenerates the chapters only, not the figures.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: House rules over every chapter
        run: python lint.py

      - name: Book-level consistency
        run: python crosscheck.py

      - name: Every chapter has its five figures and a project line
        run: |
          set -e
          fail=0
          for n in $(seq -w 1 20); do
            test -f "sections/j${n}.tex" || { echo "missing sections/j${n}.tex"; fail=1; }
            grep -q 'project{' "sections/j${n}.tex" || { echo "j${n}: no project line"; fail=1; }
            for f in arch wiring uml data timing; do
              test -f "figures/j${n}_${f}.tex" || { echo "missing figures/j${n}_${f}.tex"; fail=1; }
            done
          done
          test -f sections/front.tex
          test -f sections/appendix.tex
          test -f figures/front_map.tex
          exit $fail

      - name: The Markdown edition is in step with the source
        run: |
          set -e
          python mdbuild.py >/dev/null
          if ! git diff --quiet -- chapters; then
            echo "chapters/ is behind sections/; run python mdbuild.py and commit"
            git --no-pager diff --stat -- chapters
            exit 1
          fi
          echo "chapters/ matches sections/"

      - name: No built artefacts committed
        run: |
          set -e
          if git ls-files | grep -E '\.(pdf|html|aux|log|toc|out)$'; then
            echo "built artefacts must not be committed; they are rebuilt from source"
            exit 1
          fi
          echo "none committed, as intended"

  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chapter 4, the layer rule
        working-directory: joint-node/ch04-the-board-support-package
        run: |
          pip install -r requirements.txt
          python check_layers.py

      - name: Chapter 10, frame layout and log format
        working-directory: joint-node/ch10-the-motion-master
        run: |
          pip install -r requirements.txt
          python test/test_frames.py
          python test/test_record.py

      # The virtual interface is the whole point of running this here. If the
      # runner's kernel has no vcan module the next step still runs and reports
      # a skip with its reason, which is information rather than a false pass.
      - name: Bring up a virtual CAN interface
        run: |
          sudo modprobe vcan || echo "no vcan module on this runner"
          sudo ip link add dev vcan0 type vcan || echo "vcan0 not created"
          sudo ip link set up vcan0 || echo "vcan0 not brought up"
          ip -details link show vcan0 || true

      - name: Chapter 10, the socket
        working-directory: joint-node/ch10-the-motion-master
        run: python test/test_transport.py

      - name: Chapter 11, the generator and the host codec
        working-directory: joint-node/ch11-a-joint-protocol
        run: |
          pip install -r requirements.txt
          python tools/gen_msgs.py proto/messages.yaml --check
          python test/test_msgs.py
          python test/test_gen.py

      # The first time any of this C meets a compiler. The flags are the ones
      # the Makefile sets: -std=c11 -Wall -Wextra -Werror.
      - name: Chapter 11, compile and run the C
        working-directory: joint-node/ch11-a-joint-protocol
        run: make ctest

      - name: Chapter 11, the bus load audit
        working-directory: joint-node/ch11-a-joint-protocol
        continue-on-error: true
        run: |
          echo "This disagrees with chapter 11 on three figures and exits non zero"
          echo "on purpose. It is reported, not enforced, until the question is settled."
          python tools/busload.py --audit-chapter
