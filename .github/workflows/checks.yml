name: checks

# Two jobs, because they answer different questions and a failure in one should
# not hide the state of the other.
#
# checks   the book: house rules, cross-chapter consistency, and whether the
#          Markdown edition still matches its source. Needs only Python.
#
# software the chapters under joint-node/, each on its own terms. This is where
#          the C is compiled, which cannot happen on the win11 aquamarine
#          authoring laptop because there is no compiler there. Everything in
#          chapters 10 and 11 that is written in C is therefore first built
#          here, and a red job is the first information anyone has about it.
#
#          The socket is settled here too, since Thursday 1 October 2026. The
#          runner image ships a kernel with no vcan module, so the step below
#          installs linux-modules-extra for the running kernel before giving up.
#          What a virtual interface cannot teach is arbitration, bit timing and
#          error frames, and no step here claims otherwise.
#
# Building the book itself needs a TeX installation and is done locally, so
# the Markdown check regenerates the chapters only, not the figures.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: House rules over every chapter
        run: python lint.py

      - name: Book-level consistency
        run: python crosscheck.py

      - name: Every chapter has its five figures and a project line
        run: |
          set -e
          fail=0
          for n in $(seq -w 1 20); do
            test -f "sections/j${n}.tex" || { echo "missing sections/j${n}.tex"; fail=1; }
            grep -q 'project{' "sections/j${n}.tex" || { echo "j${n}: no project line"; fail=1; }
            for f in arch wiring uml data timing; do
              test -f "figures/j${n}_${f}.tex" || { echo "missing figures/j${n}_${f}.tex"; fail=1; }
            done
          done
          test -f sections/front.tex
          test -f sections/appendix.tex
          test -f figures/front_map.tex
          exit $fail

      - name: The Markdown edition is in step with the source
        run: |
          set -e
          python mdbuild.py >/dev/null
          if ! git diff --quiet -- chapters; then
            echo "chapters/ is behind sections/; run python mdbuild.py and commit"
            git --no-pager diff --stat -- chapters
            exit 1
          fi
          echo "chapters/ matches sections/"

      - name: No assembled volume and no PDF is published
        run: |
          set -e
          if git ls-files | grep -E '\.(pdf|html|aux|log|toc|out)$'; then
            echo "A PDF or an HTML file is committed, and neither is ever published."
            echo "What this repository offers is one Markdown chapter and one project"
            echo "at a time, which is what mdbuild.py writes. There is deliberately no"
            echo "assembled volume to download. The PDF and the HTML are for the"
            echo "author's own proofreading and stay on the authoring machine."
            exit 1
          fi
          echo "no PDF, no HTML, no assembled volume. Markdown chapters only, as intended"

      - name: No journal and no correspondence is published
        run: |
          set -e
          if git ls-files | grep -iE '(^|/)(private_journal|correspondence)/|(^|/)DIARY[^/]*\.md$'; then
            echo "A journal or a correspondence file is committed."
            echo "These live in the catalogue, which is local only. A published"
            echo "repository carries the work, never the running record of doing it."
            exit 1
          fi
          echo "no journal, no correspondence, as intended"

  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chapter 4, the layer rule
        working-directory: joint-node/ch04-the-board-support-package
        run: |
          pip install -r requirements.txt
          python check_layers.py

      # Deliberately placed ahead of the virtual interface step below, which
      # can sit for ten minutes on a kernel module download. This one needs
      # nothing but Python, so there is no reason for its answer to wait behind
      # an apt mirror.
      - name: Chapter 10, the hardware findings keep their provenance
        working-directory: joint-node/ch10-the-motion-master
        run: python tools/check_findings.py

      # The runner image ships a kernel with no vcan module, so the first
      # modprobe fails and the extra modules package for the running kernel is
      # installed before trying again.
      #
      # The last line is a hard failure on purpose. Chapter 10's README claims
      # the socket is proven against a virtual interface, and test_bus prints a
      # skip and exits zero when there is no interface to prove it against. Left
      # unchecked, a runner image that drops vcan again would turn that claim
      # into a lie behind a green tick. A red build here says which of the two
      # has to change, the step or the claim.
      - name: Bring up a virtual CAN interface
        run: |
          sudo modprobe vcan \
            || sudo apt-get install -y "linux-modules-extra-$(uname -r)" \
            || echo "no extra modules package for $(uname -r)"
          sudo modprobe vcan || echo "second modprobe failed too"
          sudo ip link add dev vcan0 type vcan || echo "vcan0 not created"
          sudo ip link set up vcan0 || echo "vcan0 not brought up"
          ip -details link show vcan0 || true
          if ! ip link show vcan0 >/dev/null 2>&1; then
            echo "vcan0 is not up, so chapter 10's socket test would only skip."
            echo "Either restore the interface or correct the acceptance table"
            echo "in joint-node/ch10-the-motion-master/README.md, which says the"
            echo "socket is proven here."
            exit 1
          fi
          echo "vcan0 is up, so the socket test below is a real test"

      # All C since the port off Python. The frame layout and the log format
      # build and run anywhere; the socket test needs the interface the step
      # above guarantees. The flags are the Makefile's own:
      # -std=c11 -Wall -Wextra -Werror.
      - name: Chapter 10, build and run the C
        working-directory: joint-node/ch10-the-motion-master
        run: make

      # Chapter 10 was written in Python first and ported to C, so this guard
      # exists to stop the Python half coming back. It used to forbid every .py
      # file in the chapter, which was too broad and went red the first time the
      # chapter gained a document checker. The rule it is really enforcing is
      # the repository's own: the chapter's CODE is C, and Python is allowed for
      # orchestration and CI, which is how chapters 9, 11 and 17 are built. So
      # the four code directories are what it checks, and tools/ is not one of
      # them. A main.py under src/ still fails, which is the case it was for.
      - name: Chapter 10, no Python left behind
        working-directory: joint-node/ch10-the-motion-master
        run: |
          set -e
          if git ls-files 'src/*' 'app/*' 'test/*' 'include/*' | grep -E '\.py$'; then
            echo "this chapter's code is C; a Python file in src, app, test or"
            echo "include is a leftover from the port"
            exit 1
          fi
          if git ls-files | grep -E '^requirements\.txt$'; then
            echo "this chapter needs no Python dependencies"
            exit 1
          fi
          echo "none, as intended"

      - name: Chapter 9, the bit timing reference and its vectors
        working-directory: joint-node/ch09-can-fd-from-the-controller-out
        run: |
          python tools/gen_bt_vectors.py --check
          python test/test_bittiming.py

      # The budget row in the chapter and this layout are the same arithmetic,
      # so the audit is gating: they cannot differ honestly.
      - name: Chapter 9, the message memory layout and the budget row
        working-directory: joint-node/ch09-can-fd-from-the-controller-out
        run: |
          python tools/gen_msgram.py --check
          python tools/gen_msgram.py --audit-chapter
          python test/test_msgram.py

      - name: Chapter 9, the frame length code
        working-directory: joint-node/ch09-can-fd-from-the-controller-out
        run: |
          python tools/gen_frame_vectors.py --check
          python test/test_frame.py

      # The first time chapter 9's C meets a compiler. It is written on a laptop
      # that has none, so until this step runs the honest claim is that the
      # Python half is proven and the C half is only written.
      - name: Chapter 9, compile and run the C
        working-directory: joint-node/ch09-can-fd-from-the-controller-out
        run: make ctest

      # Chapter 17 builds nothing, so this checks the only thing a program can
      # check about a decision document: that it still has its four headings and
      # that every claim still says where it came from.
      - name: Chapter 17, the decision document keeps its shape
        working-directory: joint-node/ch17-what-a-real-time-fieldbus-would-change
        run: python tools/check_decision.py

      - name: Chapter 11, the generator and the host codec
        working-directory: joint-node/ch11-a-joint-protocol
        run: |
          pip install -r requirements.txt
          python tools/gen_msgs.py proto/messages.yaml --check
          python test/test_msgs.py
          python test/test_gen.py

      # The first time any of this C meets a compiler. The flags are the ones
      # the Makefile sets: -std=c11 -Wall -Wextra -Werror.
      - name: Chapter 11, compile and run the C
        working-directory: joint-node/ch11-a-joint-protocol
        run: make ctest

      - name: Chapter 11, the bus load audit
        working-directory: joint-node/ch11-a-joint-protocol
        run: |
          echo "The chapter prints these figures as this program's output, so they"
          echo "have to be that. Settled on Tuesday 6 October 2026 and enforced since."
          python tools/busload.py --audit-chapter
